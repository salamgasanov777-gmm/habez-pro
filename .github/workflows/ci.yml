name: Проверки

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Установка зависимостей
        run: |
          npm --prefix api ci
          npm --prefix web ci
      - name: Сквозные тесты API
        run: npm --prefix api test
      - name: Сборка витрины
        run: npm --prefix web run build
      - name: Проверка уязвимостей в зависимостях
        run: npm --prefix api audit --audit-level=high
